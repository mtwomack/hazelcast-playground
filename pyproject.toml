[project]
name = "hazelcast-playground"
version = "1.0.0"
description = "FastAPI app for testing a Hazelcast cluster with curl or Swagger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "hazelcast-python-client>=5.4",
    "psutil>=7.2.2",
    "docker>=7.2.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
