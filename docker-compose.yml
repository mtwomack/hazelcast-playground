# Starts a local Hazelcast member (port 5701) and Management Center (http://localhost:8080).
#   docker compose up -d
#   docker compose down
services:
  hazelcast:
    image: hazelcast/hazelcast:5.5
    container_name: hazelcast
    ports:
      - "5701:5701"
    environment:
      HZ_CLUSTERNAME: dev

  management-center:
    image: hazelcast/management-center:5.5
    container_name: hz-management-center
    ports:
      - "8080:8080"
    environment:
      MC_DEFAULT_CLUSTER: dev
      MC_DEFAULT_CLUSTER_MEMBERS: hazelcast
    depends_on:
      - hazelcast
